name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/1.2.0'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref_name }}" = "release/1.2.0" ]; then
            VERSION="v1.2.0"
          else
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/corpo-em-evolucao-${VERSION}.apk

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/corpo-em-evolucao-*.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = "release/1.2.0" ]; then
            VERSION="v1.2.0"
          else
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
          fi
          APK="build/app/outputs/flutter-apk/corpo-em-evolucao-${VERSION}.apk"

          echo "==> VERSION: $VERSION"
          echo "==> APK: $APK"
          ls -la build/app/outputs/flutter-apk/

          NOTES="## Corpo em Evolução ${VERSION}

          Baixe o APK abaixo e instale no seu Android.

          > Pode ser necessário habilitar \"Instalar de fontes desconhecidas\" nas configurações do Android."

          # Tenta criar a release com o APK; se já existir, faz upload para a existente
          gh release create "$VERSION" \
            --title "Corpo em Evolução ${VERSION}" \
            --notes "$NOTES" \
            --target main \
            --latest \
            "$APK" \
          || gh release upload "$VERSION" "$APK" --clobber
